<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncryptedChat — Sign In</title>
  <meta name="description" content="Private, end-to-end encrypted chat. Just for two.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <!-- Animated background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Grid overlay -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <main class="login-container">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon-wrap">
          <span class="logo-icon">🔐</span>
        </div>
        <h1>EncryptedChat</h1>
        <p>Private. Encrypted. Just for two.</p>
      </div>

      <!-- Form -->
      <form id="loginForm" novalidate autocomplete="off">

        <div class="input-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Your username"
            autocomplete="off"
            readonly
            spellcheck="false"
            autocapitalize="none"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Your password"
              autocomplete="new-password"
              readonly
              required
            >
            <button type="button" id="togglePwd" class="eye-btn" aria-label="Toggle password visibility">
              <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-msg" role="alert" style="display:none"></div>

        <label class="remember-login" for="rememberLogin">
          <input type="checkbox" id="rememberLogin" name="rememberLogin">
          <span>Keep me signed in on this device</span>
        </label>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span id="btnLabel">Sign In</span>
          <svg id="btnArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          <div id="btnSpinner" class="spinner" style="display:none"></div>
        </button>

      </form>

      <p class="login-footer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Messages are end-to-end encrypted with AES-256
      </p>

    </div>
  </main>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
